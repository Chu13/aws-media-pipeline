<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="34" font-size="18" font-weight="700" fill="#111827">Serverless media pipeline — one CloudFront distribution fronts everything</text>

  <!-- ============ MAIN FLOW (top) ============ -->

  <!-- Browser -->
  <g>
    <rect x="30" y="80" width="150" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="105" y="110" font-size="13" font-weight="600" text-anchor="middle" fill="#1e1b4b">Browser</text>
    <text x="105" y="128" font-size="10.5" text-anchor="middle" fill="#4338ca">drag &amp; drop UI</text>
  </g>

  <!-- CloudFront (hub) -->
  <g>
    <rect x="250" y="70" width="170" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="335" y="100" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">CloudFront</text>
    <text x="335" y="116" font-size="10.5" text-anchor="middle" fill="#9a3412">/*    → site</text>
    <text x="335" y="130" font-size="10.5" text-anchor="middle" fill="#9a3412">/api/* → presign</text>
    <text x="335" y="144" font-size="10.5" text-anchor="middle" fill="#9a3412">/r/*   → outputs</text>
  </g>

  <!-- Presign Lambda -->
  <g>
    <rect x="490" y="30" width="170" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="575" y="58" font-size="13" font-weight="600" text-anchor="middle" fill="#064e3b">Presign Lambda</text>
    <text x="575" y="75" font-size="10.5" text-anchor="middle" fill="#065f46">validate · rate limit · sign</text>
    <text x="575" y="89" font-size="10.5" text-anchor="middle" fill="#065f46">Function URL, IAM auth</text>
  </g>

  <!-- DynamoDB -->
  <g>
    <rect x="730" y="30" width="150" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="805" y="55" font-size="13" font-weight="600" text-anchor="middle" fill="#1e1b4b">DynamoDB</text>
    <text x="805" y="72" font-size="10.5" text-anchor="middle" fill="#4338ca">rate limit, per-IP, TTL</text>
  </g>

  <!-- S3 Uploads -->
  <g>
    <rect x="490" y="150" width="170" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="575" y="178" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">S3 · uploads</text>
    <text x="575" y="195" font-size="10.5" text-anchor="middle" fill="#991b1b">direct browser PUT</text>
    <text x="575" y="209" font-size="10.5" text-anchor="middle" fill="#991b1b">1-day lifecycle backstop</text>
  </g>

  <!-- Process Lambda -->
  <g>
    <rect x="490" y="260" width="170" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="575" y="288" font-size="13" font-weight="600" text-anchor="middle" fill="#064e3b">Process Lambda</text>
    <text x="575" y="305" font-size="10.5" text-anchor="middle" fill="#065f46">sharp · WebP + AVIF</text>
    <text x="575" y="319" font-size="10.5" text-anchor="middle" fill="#065f46">3 sizes × 2 formats</text>
    <text x="575" y="333" font-size="10.5" text-anchor="middle" fill="#065f46">S3 ObjectCreated trigger</text>
  </g>

  <!-- S3 Outputs -->
  <g>
    <rect x="490" y="380" width="170" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="575" y="408" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">S3 · outputs</text>
    <text x="575" y="425" font-size="10.5" text-anchor="middle" fill="#991b1b">variants + manifest.json</text>
    <text x="575" y="439" font-size="10.5" text-anchor="middle" fill="#991b1b">1-day lifecycle backstop</text>
  </g>

  <!-- Arrows: main flow -->
  <path d="M180,115 H250" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="108" font-size="9.5" text-anchor="middle" fill="#374151">① GET /api/presign</text>

  <path d="M335,70 V65 H575 V100" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M660,65 H730" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M420,115 C 455,115 455,185 490,185" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="150" font-size="9.5" text-anchor="middle" fill="#374151">② presigned PUT</text>

  <path d="M575,220 V260" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="243" font-size="9.5" text-anchor="middle" fill="#374151">③ S3 event</text>

  <path d="M575,340 V380" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="363" font-size="9.5" text-anchor="middle" fill="#374151">④ write variants</text>

  <path d="M490,405 C 455,405 455,150 420,140" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="447" y="270" font-size="9.5" text-anchor="middle" fill="#374151">⑤ GET /r/{jobId}/manifest.json (poll)</text>

  <!-- ============ CLEANUP (bottom) ============ -->

  <g>
    <rect x="30" y="530" width="190" height="60" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="125" y="555" font-size="13" font-weight="600" text-anchor="middle" fill="#713f12">EventBridge Rule</text>
    <text x="125" y="572" font-size="10.5" text-anchor="middle" fill="#854d0e">rate(10 minutes)</text>
  </g>

  <g>
    <rect x="270" y="530" width="190" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="365" y="555" font-size="13" font-weight="600" text-anchor="middle" fill="#064e3b">Cleanup Lambda</text>
    <text x="365" y="572" font-size="10.5" text-anchor="middle" fill="#065f46">sweeps objects &gt; 60 min old</text>
  </g>

  <path d="M220,560 H270" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M365,530 C 365,480 500,450 490,420" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M365,530 C 460,480 500,250 490,215" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="430" y="480" font-size="9.5" fill="#374151">deletes stale objects in both buckets —</text>
  <text x="430" y="493" font-size="9.5" fill="#374151">the real ~60-min mechanism; S3 Lifecycle</text>
  <text x="430" y="506" font-size="9.5" fill="#374151">can't express "1 hour" (day granularity only)</text>

  <!-- Legend -->
  <g font-size="10.5" fill="#374151">
    <rect x="900" y="540" width="14" height="14" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="920" y="551">Client / data store</text>
    <rect x="900" y="562" width="14" height="14" fill="#ecfdf5" stroke="#059669"/>
    <text x="920" y="573">Compute (Lambda)</text>
    <rect x="900" y="584" width="14" height="14" fill="#fef2f2" stroke="#dc2626"/>
    <text x="920" y="595">Storage (S3)</text>
    <rect x="900" y="606" width="14" height="14" fill="#fff7ed" stroke="#ea580c"/>
    <text x="920" y="617">Edge / CDN</text>
  </g>
</svg>
